<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CloudStorage - Login</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f8fd;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            border-bottom: 1px solid #e5eaf1;
        }

        .logo {
            color: #1267e8;
            font-size: 21px;
            font-weight: bold;
            text-decoration: none;
        }

        .home {
            color: #333;
            text-decoration: none;
        }

        .container {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login-card {
            width: 400px;
            background: white;
            padding: 38px;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(30, 60, 100, 0.10);
        }

        .cloud-logo {
            text-align: center;
            color: #1267e8;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d7e0eb;
            border-radius: 7px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus {
            border-color: #1267e8;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #1267e8;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        button:hover {
            background: #095acb;
        }

        .signup {
            text-align: center;
            margin-top: 22px;
            color: #718096;
        }

        .signup a {
            color: #1267e8;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            background: #ffecec;
            color: #c62828;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

    </style>

</head>


<body>

<header class="navbar">

    <a href="/" class="logo">
        ☁ CloudStorage
    </a>

    <a href="/" class="home">
        Home
    </a>

</header>


<div class="container">

    <form
        method="POST"
        class="login-card"
    >

        <div class="cloud-logo">
            ☁ CloudStorage
        </div>

        <h1>
            Welcome Back
        </h1>

        <p class="subtitle">
            Login to access your account
        </p>


        {% with messages =
            get_flashed_messages(
                with_categories=true
            )
        %}

        {% for category, message in messages %}

        <div class="message">
            {{ message }}
        </div>

        {% endfor %}

        {% endwith %}


        <label>
            Email Address
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button  type="submit">
            Login
        </button>


        <div class="signup">

            Don't have an account?

            <a href="/signup">
                Sign Up
            </a>

        </div>

    </form>

</div>

</body>
</html>
